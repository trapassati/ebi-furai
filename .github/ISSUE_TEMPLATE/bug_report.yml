name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead. Screenshots help.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: Settings → About, or the first line of the server log.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Installed with
      options: [Docker, Linux service, Built from source]
    validations:
      required: true
  - type: input
    attributes:
      label: Device and browser
      placeholder: iPhone 16, iOS 26, installed app
  - type: textarea
    attributes:
      label: Server log
      description: The lines around the problem (docker compose logs ebi-furai, or journalctl -u ebi-furai). Remove addresses you don't want to share.
      render: text
